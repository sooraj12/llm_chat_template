server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    location /chat/ {
        alias /usr/share/nginx/html;
        try_files $uri /chat/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # location / {
    #     root /usr/share/nginx/html;
    #     try_files $uri.html $uri $uri/ $uri/chat /index.html;
    # }
}